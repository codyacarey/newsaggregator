# Feed configuration for feed.codycarey.com
#
# Structure:
#   topics:
#     - name: <topic shown as a section heading>
#       feeds:
#         - name: <display name, also used as the stable source key in the archive>
#           url:  <RSS/Atom feed URL>
#           site: <homepage link for the card header>
#
# Notes:
# - "name" is stored on every archived article; renaming a feed orphans its
#   history under the old name, so prefer adding a new entry over renaming.
# - The fetcher tolerates failures: a broken feed shows an error badge on the
#   site but never blocks the other feeds.

